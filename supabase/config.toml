project_id = "growthos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.publish-due]
verify_jwt = false

[functions.sync-results]
verify_jwt = false

[functions.refresh-tokens]
verify_jwt = false

[functions.reconcile-organic]
verify_jwt = false

[functions.send-messages]
verify_jwt = false
